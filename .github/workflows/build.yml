name: Build and Release
run-name: ${{ github.actor }} started ${{ github.ref_type }} build for ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build for all browsers
        run: npm run build

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/chrome.zip
          if-no-files-found: error

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: extension/firefox.xpi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Chrome extension artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: release-assets

      - name: Download Firefox extension artifact
        uses: actions/download-artifact@v4
        with:
          name: firefox-extension
          path: release-assets

      - name: Prepare versioned release archives
        run: |
          mv release-assets/chrome.zip "release-assets/kutt-extension-chrome-${GITHUB_REF_NAME}.zip"
          mv release-assets/firefox.xpi "release-assets/kutt-extension-firefox-${GITHUB_REF_NAME}.xpi"

      - name: Validate release archives
        run: |
          unzip -t "release-assets/kutt-extension-chrome-${GITHUB_REF_NAME}.zip"
          unzip -t "release-assets/kutt-extension-firefox-${GITHUB_REF_NAME}.xpi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/kutt-extension-chrome-${{ github.ref_name }}.zip
            release-assets/kutt-extension-firefox-${{ github.ref_name }}.xpi
